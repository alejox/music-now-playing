NowPlaying.Player.Help="De qué reproductor se muestra la canción. \"Igual que el dock\" sigue la lista Reproductor del dock Música; \"Automático\", el que esté sonando. \"El reproductor del sistema\" es Apple Music en macOS y, en Windows, el Reproductor multimedia (también Apple Music o iTunes). Con uno elegido, lo que suene en otro se ignora (y la tarjeta se oculta si ese no suena). En macOS, el sistema avisa de un solo reproductor a la vez: si avisa de otro, la tarjeta espera a que vuelva a sonar el elegido."
