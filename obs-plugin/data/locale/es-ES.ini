NowPlaying.Media.Video="Video si es posible"
NowPlaying.Media.Help="Muestra el video de YouTube (sin sonido, sincronizado) en lugar de la carátula. Con YouTube Music o YouTube en el navegador, el que suena; con Spotify (la app o el reproductor web), Apple Music y otras apps, el que da la búsqueda en YouTube por título y artista (puede ir algo corrido si el video tiene una intro). Si no se puede, muestra la carátula. En macOS, la primera vez pregunta si OBS puede controlar el navegador: responde Permitir. En Windows, lee la barra de direcciones de la ventana cuya pestaña visible es YouTube; si no puede, busca el video por su título."
