NowPlaying.Media.Help="With YouTube Music or YouTube in the browser, shows the video (muted, in sync) instead of the album art. Falls back to the album art otherwise. On macOS, the first time it asks whether OBS may control the browser: answer Allow. On Windows, it reads the address bar of the window whose visible tab is YouTube; if it can't, it looks the video up by its title."
