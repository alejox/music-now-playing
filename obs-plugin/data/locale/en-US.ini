NowPlaying.Style.Help="Glass, macOS window and Pill let the scene show through, tinted with the album art color (combine them with \"Blurred album art background\" for a frosted look). The other styles bring their own colors and decoration and show the album art in a circle; they work in both horizontal and vertical layouts."
