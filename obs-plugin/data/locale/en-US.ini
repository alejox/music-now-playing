NowPlaying.Media.Art="Album art"
NowPlaying.Media.Video="Video when possible"
NowPlaying.Media.Help="Shows the YouTube video (muted, in sync) instead of the album art. With YouTube Music or YouTube in the browser, the one playing; with Spotify (the app or the web player), Apple Music and other apps, the one a YouTube search by title and artist finds (it may be a bit off if the video has an intro). Falls back to the album art otherwise. On macOS, the first time it asks whether OBS may control the browser: answer Allow. On Windows, it reads the address bar of the window whose visible tab is YouTube; if it can't, it looks the video up by its title."
NowPlaying.VideoFit="Video shape"
