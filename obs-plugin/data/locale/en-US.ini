NowPlaying.Channel.NeedsPipeWire="On Linux, OBS has no per-application audio capture: install the <a href=\"https://github.com/dimtpap/obs-pipewire-audio-capture\">obs-pipewire-audio-capture</a> plugin, restart OBS and create the channel again."
NowPlaying.Channel.Created="Done: the \"%1\" channel captures only the sound of %2. Set its volume in the Audio Mixer.<br><br>If you also capture the whole desktop audio, the music comes in twice: mute or remove that capture."
NowPlaying.Channel.Updated="Done: the \"%1\" channel now captures the sound of %2."
