NowPlaying.Volume.PlayerHelp="The bar changes the player's volume: what you hear and what the stream gets. On Windows, with the music in a browser, it's the whole browser's volume."
NowPlaying.Volume.StreamHelp="The bar changes only OBS's \"Music (Now Playing)\" channel: the music gets quieter on stream while you keep hearing it the same."
NowPlaying.Volume.NoChannel="Stream volume needs the music channel: click the speaker to create it."
