NowPlaying.Player.Help="Which player the song is shown from. \"Same as the dock\" follows the Player list in the Music dock; \"Automatic\" uses whichever is playing. \"The system player\" is Apple Music on macOS and, on Windows, Media Player (also Apple Music or iTunes). With one chosen, anything playing elsewhere is ignored (and the card hides while that player is silent). On macOS the system reports a single player at a time: while it reports another one, the card waits for the chosen player to play again."
NowPlaying.Player.DockHelp="Which player the song is shown from here (and where the buttons go). Sources set to \"Same as the dock\" follow it."
