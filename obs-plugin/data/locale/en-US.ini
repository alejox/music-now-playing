NowPlaying.Layout.Help="Vertical puts a big album art on top. Changing the layout or the album art size adjusts width and height automatically."
NowPlaying.Fallback="Image when there is no album art (your logo)"
NowPlaying.Fallback.Help="Shown instead of the album art when the song has none. The card colors come from this image. To change it, click Browse and pick another; to remove it, \"Remove logo\"."
