name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sintaxis
        run: |
          node --check server.js
          node --check media/macos.js
          node --check now-playing.user.js
          node --check ui.js
      - name: Sintaxis del lector de Windows
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/media/windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - name: Prueba de humo
        run: npm test

  # Los lectores del sistema solo se pueden probar en el sistema de verdad. En las
  # máquinas de GitHub no suena nada, así que lo esperado es {"sessions":[]}: lo que se
  # prueba es que arrancan, cargan las APIs del sistema y escriben el protocolo.
  windows-reader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Diagnóstico paso a paso (WinRT en Windows PowerShell 5.1)
        continue-on-error: true
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -Command {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            "PowerShell $($PSVersionTable.PSVersion) / $([Environment]::OSVersion.VersionString)"
            Add-Type -AssemblyName System.Runtime.WindowsRuntime
            "Add-Type: $($sw.ElapsedMilliseconds) ms"
            $type = [Windows.Media.Control.GlobalSystemMediaTransportControlsSessionManager,Windows.Media.Control,ContentType=WindowsRuntime]
            "tipo SMTC: $($sw.ElapsedMilliseconds) ms"
            $asTask = [System.WindowsRuntimeSystemExtensions].GetMethods() | Where-Object { $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' } | Select-Object -First 1
            $task = $asTask.MakeGenericMethod($type).Invoke($null, @($type::RequestAsync()))
            "RequestAsync terminó: $($task.Wait(15000)) a los $($sw.ElapsedMilliseconds) ms, estado $($task.Status)"
            if ($task.Exception) { "error: $($task.Exception.InnerException.Message)" }
            if ($task.IsCompleted -and -not $task.IsFaulted) { "sesiones: $(@($task.Result.GetSessions()).Count)" }
          }

      - name: El lector de Windows arranca y responde
        shell: pwsh
        run: |
          $cmdFile = Join-Path $env:RUNNER_TEMP 'command.json'
          $p = Start-Process powershell.exe -PassThru -NoNewWindow `
            -ArgumentList '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "$PWD\media\windows.ps1", '-CommandFile', $cmdFile `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 15
          '{"cmd":"playpause","app":"no-existe.exe"}' | Set-Content $cmdFile
          Start-Sleep -Seconds 4
          Stop-Process -Id $p.Id -Force
          "--- salida"; Get-Content out.txt -TotalCount 5
          "--- errores"; Get-Content err.txt
          $lines = @(Get-Content out.txt)
          if ($lines.Count -lt 3) { throw "El lector escribió solo $($lines.Count) líneas" }
          $first = $lines[0] | ConvertFrom-Json
          if ($first.error) { throw "El lector falló: $($first.error)" }
          if ($null -eq $first.sessions) { throw 'Salida inesperada' }
          if (Test-Path $cmdFile) { throw 'El lector no leyó el archivo de comandos' }

  mac-reader:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: El lector de macOS arranca y responde
        run: |
          osascript -l JavaScript media/macos.js > out.txt 2> err.txt &
          pid=$!
          sleep 6
          kill "$pid" || true
          echo "--- salida"; head -5 out.txt
          echo "--- errores"; cat err.txt
          echo "--- búsqueda de carátulas en el catálogo (YouTube Music y otros)"
          osascript -l JavaScript media/macos.js artwork "Behind Blue Eyes" "Limp Bizkit" | tee art1.txt
          osascript -l JavaScript media/macos.js artwork "Ojitos Lindos (Official Video)" "Bad Bunny" | tee art2.txt
          osascript -l JavaScript media/macos.js artwork "Receta de arepas" "Canal de cocina" | tee art3.txt
          grep -q '"found":true' art1.txt && grep -q '"found":true' art2.txt || { echo "No encontró carátulas conocidas"; exit 1; }
          grep -q '"found":false' art3.txt || { echo "Aceptó una carátula para algo que no es una canción"; exit 1; }
          echo "--- comando (sin nada sonando puede fallar, solo se muestra)"
          osascript -l JavaScript media/macos.js command playpause || true
          node -e "
            const lines = require('fs').readFileSync('out.txt', 'utf8').trim().split('\n').filter(Boolean);
            if (lines.length < 3) throw new Error('El lector escribió solo ' + lines.length + ' líneas');
            const first = JSON.parse(lines[0]);
            if (first.error) throw new Error('El lector falló: ' + first.error);
            if (!Array.isArray(first.sessions)) throw new Error('Salida inesperada');
          "
