name: Plugin de OBS

# Compila el plugin nativo (obs-plugin/) en un Mac con Xcode, en un Windows con
# Visual Studio y en un Ubuntu con la libobs del PPA de OBS. Release lo reutiliza para
# adjuntar los zips, el .deb y el .tar.gz a la Release.
on:
  push:
    branches: [main]
    paths: ['obs-plugin/**', 'media/**', 'ui.js', 'test/video-mode.js', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['obs-plugin/**', 'media/**', 'ui.js', 'test/video-mode.js', '.github/workflows/plugin.yml']
  workflow_call:
  workflow_dispatch:

jobs:
  # El plugin lleva copias de los lectores y de ui.js: tienen que ser iguales a las de la app.
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Copias al día
        run: |
          cmp media/windows.ps1 obs-plugin/data/media/windows.ps1
          cmp media/macos.js obs-plugin/data/media/macos.js
          cmp media/linux.sh obs-plugin/data/media/linux.sh
          cmp ui.js obs-plugin/data/overlay/ui.js

  # El modo video de la tarjeta necesita YouTube de verdad: se prueba en un Chromium real.
  video-mode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright + Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium chromium-headless-shell
      - name: El video aparece, va sincronizado y sin sonido
        run: |
          python3 -m http.server 8000 --directory obs-plugin/data/overlay >/dev/null 2>&1 &
          sleep 2
          node test/video-mode.js http://127.0.0.1:8000/index.html .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-mode
          path: video-*.png

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: obs-plugin
    steps:
      - uses: actions/checkout@v5
      - name: Versión
        id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('buildspec.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Configurar (descarga OBS, obs-deps y Qt)
        run: |
          xcodebuild -version
          cmake --preset macos
      - name: Compilar con Xcode
        run: |
          set -o pipefail
          cmake --build --preset macos 2>&1 | tee build.log || { echo "--- errores"; grep -E "error:|warning:" build.log | sort -u; exit 1; }
      - name: Empaquetar
        run: |
          plugin="$(find build_macos -type d -name 'obs-now-playing.plugin' -path '*RelWithDebInfo*' | head -1)"
          echo "plugin: $plugin"
          codesign --verify --deep --strict --verbose=2 "$plugin"
          codesign -dv "$plugin" 2>&1 | grep -E "Identifier|Signature|Format"
          ls "$plugin/Contents/Resources" "$plugin/Contents/Resources/media"
          mkdir -p ../dist
          ditto -c -k --keepParent "$plugin" "../dist/music-now-playing-plugin-${{ steps.version.outputs.v }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-macos
          path: dist/*

  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: obs-plugin
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Versión
        id: version
        run: '"v=$((Get-Content buildspec.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'
      - name: Configurar (descarga OBS, obs-deps y Qt)
        run: cmake --preset windows-x64
      - name: Compilar con Visual Studio
        run: cmake --build --preset windows-x64
      - name: Empaquetar
        run: |
          cmake --install build_x64 --prefix release --config RelWithDebInfo
          # Con la forma de la carpeta de OBS (C:\Program Files\obs-studio): el .dll en
          # obs-plugins\64bit y los datos en data\obs-plugins\obs-now-playing. Se instala
          # copiando las dos carpetas del zip encima de la de OBS. Sin los símbolos .pdb.
          $built = "release/obs-now-playing"
          New-Item -ItemType Directory -Force package/obs-plugins/64bit, package/data/obs-plugins | Out-Null
          Copy-Item "$built/bin/64bit/obs-now-playing.dll" package/obs-plugins/64bit/
          Copy-Item "$built/data" package/data/obs-plugins/obs-now-playing -Recurse
          Get-ChildItem -Recurse package | Select-Object -ExpandProperty FullName
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Compress-Archive -Path package/* -DestinationPath "../dist/music-now-playing-plugin-${{ steps.version.outputs.v }}-windows-x64.zip"
      - name: El zip trae la forma de la carpeta de OBS
        run: |
          $zip = Get-Item "../dist/music-now-playing-plugin-*-windows-x64.zip"
          $dir = Join-Path $env:RUNNER_TEMP $zip.BaseName
          Expand-Archive $zip.FullName -DestinationPath $dir
          foreach ($file in 'obs-plugins\64bit\obs-now-playing.dll', 'data\obs-plugins\obs-now-playing\media\windows.ps1',
                            'data\obs-plugins\obs-now-playing\overlay\index.html', 'data\obs-plugins\obs-now-playing\locale\es-ES.ini') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Falta $file en el zip" }
          }
          $extra = Get-ChildItem $dir | Where-Object { $_.Name -notin 'obs-plugins', 'data' }
          if ($extra) { throw "El zip trae de más: $($extra.Name -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: dist/*

  # Linux: contra la libobs y obs-frontend-api del PPA oficial de OBS (la versión que
  # tenga el PPA, cercana a la de buildspec.json) y el Qt 6 de Ubuntu. Sale un .deb (para
  # /usr, junto al OBS del PPA) y un .tar.gz con la forma de ~/.config/obs-studio/plugins.
  linux:
    # Un fallo de Linux no bloquea la Release de Windows y Mac (release.yml usa este workflow).
    continue-on-error: true
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: obs-plugin
    steps:
      - uses: actions/checkout@v5
      - name: Versión
        id: version
        run: echo "v=$(python3 -c "import json;print(json.load(open('buildspec.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Dependencias (OBS del PPA, Qt 6)
        run: |
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config ccache \
            obs-studio qt6-base-dev qt6-base-private-dev libqt6svg6-dev libsimde-dev libgles2-mesa-dev
          echo "OBS del PPA: $(dpkg-query -W -f='${Version}' obs-studio)"
      - name: Configurar
        run: cmake --preset ubuntu-ci-x86_64
      - name: Compilar
        run: cmake --build --preset ubuntu-ci-x86_64
      - name: Empaquetar (.deb y .tar.gz)
        run: |
          v="${{ steps.version.outputs.v }}"
          mkdir -p ../dist
          (cd build_x86_64 && cpack -G DEB)
          for deb in release/*.deb; do
            case "$deb" in *dbgsym*) continue ;; esac
            dpkg-deb -c "$deb"
            cp "$deb" "../dist/music-now-playing-plugin-$v-linux-x86_64.deb"
          done
          test -f "../dist/music-now-playing-plugin-$v-linux-x86_64.deb"
          # La forma de la carpeta de plugins del usuario: obs-now-playing/bin/64bit/*.so y
          # obs-now-playing/data/… (se descomprime en ~/.config/obs-studio/plugins/).
          cmake --install build_x86_64 --prefix "$PWD/release/staging"
          so="$(find release/staging -name 'obs-now-playing.so' | head -1)"
          test -n "$so"
          pkg=release/tar/obs-now-playing
          mkdir -p "$pkg/bin/64bit"
          cp "$so" "$pkg/bin/64bit/obs-now-playing.so"
          cp -R release/staging/share/obs/obs-plugins/obs-now-playing "$pkg/data"
          chmod 755 "$pkg/data/media/linux.sh"
          tar -czf "../dist/music-now-playing-plugin-$v-linux-x86_64.tar.gz" -C release/tar obs-now-playing
      - name: El .tar.gz trae la forma de la carpeta de plugins
        run: |
          list="$(tar -tzf ../dist/music-now-playing-plugin-*-linux-x86_64.tar.gz)"
          echo "$list"
          for file in obs-now-playing/bin/64bit/obs-now-playing.so obs-now-playing/data/media/linux.sh \
                      obs-now-playing/data/overlay/index.html obs-now-playing/data/locale/es-ES.ini; do
            echo "$list" | grep -qx "$file" || { echo "Falta $file en el .tar.gz"; exit 1; }
          done
          # El .so carga sin símbolos sin resolver de más (libobs, Qt) y exporta el módulo.
          nm -D --defined-only release/tar/obs-now-playing/bin/64bit/obs-now-playing.so | grep -q obs_module_load
          ldd release/tar/obs-now-playing/bin/64bit/obs-now-playing.so
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: dist/*
