name: Release

# Publicar una versión: sube la versión en package.json, haz commit y luego
#   - empuja un tag:  git tag v2.0.1 && git push origin v2.0.1
#   - o en GitHub: Actions → Release → Run workflow (crea el tag v<versión> solo).
# Esto compila el plugin de OBS y adjunta sus 3 zips (macOS, Windows, Linux) a la Release,
# cada uno con su firma <zip>.sig (hace falta el secreto RELEASE_SIGNING_KEY).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar la Release v<versión de package.json> (si no, solo deja los zips del plugin como artefacto)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # El plugin nativo de OBS (obs-plugin/), compilado en Mac, Windows y Linux.
  plugin:
    uses: ./.github/workflows/plugin.yml

  publish:
    needs: [plugin]
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Versión
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "El tag es $GITHUB_REF_NAME pero package.json dice $tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pv=$(node -p "require('./obs-plugin/buildspec.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      # Cada zip lleva su firma Ed25519 (<zip>.sig, 64 bytes): el actualizador del plugin no
      # instala un zip sin firma válida. La clave privada es el secreto RELEASE_SIGNING_KEY (PEM);
      # su clave pública tiene que ser la que va dentro del plugin (src/release-signature.cpp).
      - name: Firmar los zips
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "Falta el secreto RELEASE_SIGNING_KEY"; exit 1; }
          openssl version
          key="$RUNNER_TEMP/release-signing-key.pem"
          pub="$RUNNER_TEMP/release-signing-key.pub.pem"
          trap 'rm -f "$key" "$pub"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          chmod 600 "$key"
          openssl pkey -in "$key" -pubout -out "$pub"
          expected="$(sed -nE 's#^// ([0-9a-f]{64})$#\1#p' obs-plugin/src/release-signature.cpp)"
          actual="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          [ -n "$expected" ] && [ "$actual" = "$expected" ] || {
            echo "La clave de RELEASE_SIGNING_KEY ($actual) no es la del plugin ($expected)"; exit 1; }
          pv="${{ steps.version.outputs.pv }}"
          for f in "dist/music-now-playing-$pv-macos.zip" "dist/music-now-playing-$pv-windows-x64.zip" \
                   "dist/music-now-playing-$pv-linux-x86_64.zip"; do
            test -f "$f" || { echo "Falta $f"; ls dist; exit 1; }
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$f" -out "$f.sig"
            [ "$(stat -c %s "$f.sig")" -eq 64 ] || { echo "La firma de $f no tiene 64 bytes"; exit 1; }
            openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in "$f" -sigfile "$f.sig"
          done
      # Los 3 zips de la Release (uno por sistema) con sus firmas, y nada más.
      - name: Archivos de la Release
        run: |
          shopt -s nullglob
          pv="${{ steps.version.outputs.pv }}"
          for f in "dist/music-now-playing-$pv-macos.zip" "dist/music-now-playing-$pv-windows-x64.zip" \
                   "dist/music-now-playing-$pv-linux-x86_64.zip"; do
            for g in "$f" "$f.sig"; do
              test -f "$g" || { echo "Falta $g"; ls dist; exit 1; }
              echo "$g"
            done
          done
          files=(dist/*)
          [ "${#files[@]}" -eq 6 ] || { echo "Esperaba 6 archivos y hay ${#files[@]}: ${files[*]}"; exit 1; }
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Music Now Playing ${{ steps.version.outputs.tag }}
          files: |
            dist/music-now-playing-${{ steps.version.outputs.pv }}-macos.zip
            dist/music-now-playing-${{ steps.version.outputs.pv }}-windows-x64.zip
            dist/music-now-playing-${{ steps.version.outputs.pv }}-linux-x86_64.zip
            dist/music-now-playing-${{ steps.version.outputs.pv }}-macos.zip.sig
            dist/music-now-playing-${{ steps.version.outputs.pv }}-windows-x64.zip.sig
            dist/music-now-playing-${{ steps.version.outputs.pv }}-linux-x86_64.zip.sig
          generate_release_notes: true
          body: |
            > Desde esta versión solo se publica el plugin de OBS, para instalar copiando y pegando una carpeta. Si tienes el plugin 1.0.35 o una versión anterior, no se actualiza solo a esta: descarga el zip de tu sistema una vez (abajo); desde ahí las actualizaciones vuelven a ser automáticas.

            ## Instalar (fuente "Now Playing" y dock "Música")
            Cierra OBS, descomprime el zip de tu sistema y copia la carpeta que trae:
            - **Windows 10/11 (OBS 33 o superior):** `music-now-playing-…-windows-x64.zip` → copia la carpeta `obs-now-playing` en `C:\ProgramData\obs-studio\plugins\`. Si tenías una copia de antes, borra `C:\Program Files\obs-studio\obs-plugins\64bit\obs-now-playing.dll` y `C:\Program Files\obs-studio\data\obs-plugins\obs-now-playing`.
            - **macOS (OBS 31 o superior):** `music-now-playing-…-macos.zip` → copia `obs-now-playing.plugin` en `~/Library/Application Support/obs-studio/plugins/` y ejecuta en Terminal: `xattr -cr ~/Library/Application\ Support/obs-studio/plugins/obs-now-playing.plugin`
            - **Linux x86_64 (OBS 31 o superior):** `music-now-playing-…-linux-x86_64.zip` → copia la carpeta `obs-now-playing` en `~/.config/obs-studio/plugins/` e instala `playerctl` (por ejemplo `sudo apt install playerctl`).

            Abre OBS. Más detalles: [obs-plugin/README](${{ github.server_url }}/${{ github.repository }}/tree/main/obs-plugin#instalar).
      - name: Actualizar alejoxcode
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          [ -n "$VERCEL_DEPLOY_HOOK" ] || { echo "Sin VERCEL_DEPLOY_HOOK: se omite"; exit 0; }
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
