name: Release

# Publicar una versión: sube la versión en package.json, haz commit y luego
#   - empuja un tag:  git tag v2.0.1 && git push origin v2.0.1
#   - o en GitHub: Actions → Release → Run workflow (crea el tag v<versión> solo).
# Esto genera los instaladores y los adjunta a la Release de ese tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar la Release v<versión de package.json> (si no, solo deja los instaladores como artefacto)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Herramientas (NSIS, Pillow, clang y lld)
        run: sudo apt-get update && sudo apt-get install -y nsis python3-pil clang lld
      - name: Versión
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "El tag es $GITHUB_REF_NAME pero package.json dice $tag"; exit 1
          fi
      - name: Prueba de humo
        run: npm test
      - name: Instaladores
        run: ./build/build.sh
      - name: Guardar como artefacto
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: instaladores
          path: dist/*
      - name: Publicar Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OBS Now Playing ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Descargas
            - **Windows 10/11:** `OBS-Now-Playing-Setup-….exe`
            - **Mac con chip Apple (M1/M2/M3/M4…):** `OBS-Now-Playing-…-mac-apple.zip`
            - **Mac con Intel:** `OBS-Now-Playing-…-mac-intel.zip`

            Cómo instalar y qué hacer con los avisos de Windows/macOS: [README](${{ github.server_url }}/${{ github.repository }}#1-instalar).
