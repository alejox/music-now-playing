name: Release

# Publicar una versión: sube la versión en package.json, haz commit y luego
#   - empuja un tag:  git tag v2.0.1 && git push origin v2.0.1
#   - o en GitHub: Actions → Release → Run workflow (crea el tag v<versión> solo).
# Esto genera los instaladores y los adjunta a la Release de ese tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar la Release v<versión de package.json> (si no, solo deja los instaladores como artefacto)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # PUENTE DE NOMBRES DEL PLUGIN. Los paquetes del plugin se llaman music-now-playing-plugin-….
  # Los plugins instalados hasta la 1.0.33 solo reconocen obs-now-playing-plugin-… en la
  # última Release: con 'true', publish sube además una copia idéntica de cada paquete con el
  # nombre viejo para que esas versiones se puedan actualizar. Cuando ya no haga falta, pon
  # 'false' y la Release solo tendrá music-now-playing-plugin-….
  LEGACY_PLUGIN_ASSET_NAMES: 'true'

jobs:
  # El instalador de Windows también instala el plugin: necesita el zip ya compilado.
  windows:
    needs: [plugin]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Herramientas (NSIS y Pillow)
        run: sudo apt-get update && sudo apt-get install -y nsis python3-pil
      - name: Versión
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "El tag es $GITHUB_REF_NAME pero package.json dice $tag"; exit 1
          fi
      - name: Prueba de humo
        run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: plugin-windows
          path: plugin-windows
      - name: Instalador de Windows (app + plugin de OBS)
        run: PLUGIN_ZIP="$(ls plugin-windows/music-now-playing-plugin-*-windows-x64.zip)" ./build/build.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # En un Mac de verdad: la app queda firmada ad hoc entera (sin eso, macOS la da por
  # "dañada" al descargarla) y se prueba que abre.
  mac:
    # La app de Mac lleva el plugin de OBS y lo instala al abrirse: necesita el zip compilado.
    needs: [plugin]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: plugin-macos
          path: plugin-macos
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install pillow
      - name: Apps de macOS (con el plugin de OBS adentro)
        run: PLUGIN_ZIP_MAC="$(ls "$PWD"/plugin-macos/music-now-playing-plugin-*-macos.zip)" ./build/build.sh mac
      - name: La app firmada abre y responde
        run: |
          app_dir="$RUNNER_TEMP/prueba"
          mkdir -p "$app_dir"
          ditto -x -k dist/Music-Now-Playing-*-mac-apple.zip "$app_dir"
          app="$app_dir/OBS Now Playing.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature"
          open "$app"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          sleep 4
          curl -fs http://127.0.0.1:8787/api/now-playing
          echo
          curl -fs http://127.0.0.1:8787/ | grep -o 'Lector del sistema:</b>.\{0,200\}' | sed 's/<[^>]*>//g'
          echo "--- log"; cat "$HOME/Library/Application Support/OBS Now Playing/log.txt"
          # La app instaló el plugin en la carpeta de plugins de OBS.
          plugin="$HOME/Library/Application Support/obs-studio/plugins/obs-now-playing.plugin"
          test -f "$plugin/Contents/MacOS/obs-now-playing" || { echo "La app no instaló el plugin de OBS"; exit 1; }
          test -f "$plugin/Contents/Resources/overlay/index.html" || { echo "El plugin instalado está incompleto"; exit 1; }
          codesign --verify --deep "$plugin"
          plutil -extract CFBundleShortVersionString raw "$plugin/Contents/Info.plist" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  # Linux: .tar.gz con node, la app, el lanzador, el .desktop, install.sh y el plugin de
  # OBS. Se prueba que install.sh lo deja todo en su lugar y que la app abre y responde.
  linux:
    needs: [plugin]
    # Si Linux falla, la Release de Windows y Mac sale igual (sin los archivos de Linux).
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Herramientas (Pillow y playerctl)
        run: sudo apt-get update && sudo apt-get install -y python3-pil playerctl
      - uses: actions/download-artifact@v4
        with:
          name: plugin-linux
          path: plugin-linux
      - name: Paquete de Linux (app + plugin de OBS)
        run: PLUGIN_TAR="$(ls "$PWD"/plugin-linux/music-now-playing-plugin-*-linux-x86_64.tar.gz)" ./build/build.sh linux
      - name: install.sh instala y la app abre y responde
        run: |
          # El runner define XDG_CONFIG_HOME: sin esto install.sh usaría el ~/.config real.
          unset XDG_CONFIG_HOME XDG_DATA_HOME
          work="$RUNNER_TEMP/prueba"
          mkdir -p "$work/home"
          tar -xzf dist/Music-Now-Playing-*-linux-x64.tar.gz -C "$work"
          HOME="$work/home" "$work/obs-now-playing/install.sh"
          app="$work/home/.local/share/obs-now-playing"
          test -f "$work/home/.local/share/applications/obs-now-playing.desktop"
          test -f "$work/home/.config/obs-studio/plugins/obs-now-playing/bin/64bit/obs-now-playing.so" || { echo "install.sh no instaló el plugin de OBS"; exit 1; }
          HOME="$work/home" "$app/obs-now-playing" --quiet
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          sleep 4
          curl -fs http://127.0.0.1:8787/api/now-playing
          echo
          curl -fs http://127.0.0.1:8787/ | grep -o 'Lector del sistema:</b>.\{0,200\}' | sed 's/<[^>]*>//g'
          echo "--- log"; cat "$work/home/.config/obs-now-playing/log.txt"
          HOME="$work/home" "$app/obs-now-playing" --stop
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # El plugin nativo de OBS (obs-plugin/), compilado en Mac, Windows y Linux.
  plugin:
    uses: ./.github/workflows/plugin.yml

  publish:
    needs: [windows, mac, linux, plugin]
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Versión
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Ver LEGACY_PLUGIN_ASSET_NAMES arriba: copias con el nombre viejo para los plugins <= 1.0.33.
      - name: Copias del plugin con el nombre viejo
        id: legacy
        run: |
          if [ "$LEGACY_PLUGIN_ASSET_NAMES" != "true" ]; then
            echo "note=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          files=(dist/music-now-playing-plugin-*)
          [ "${#files[@]}" -eq 4 ] || { echo "Esperaba 4 paquetes del plugin y hay ${#files[@]}: ${files[*]}"; exit 1; }
          for f in "${files[@]}"; do
            legacy="dist/obs-now-playing-plugin-${f#dist/music-now-playing-plugin-}"
            cp "$f" "$legacy"
            cmp "$f" "$legacy"
            echo "$legacy"
          done
          echo 'note=Los archivos `obs-now-playing-plugin-…` son copias solo para que se actualicen automáticamente las versiones anteriores del plugin: descarga los `music-now-playing-plugin-…`.' >> "$GITHUB_OUTPUT"
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Music Now Playing ${{ steps.version.outputs.tag }}
          # Solo los instaladores y los paquetes: los demás artefactos (capturas de las
          # pruebas del modo video) no son descargas.
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          generate_release_notes: true
          body: |
            ## Descargas
            - **Windows 10/11:** `Music-Now-Playing-Setup-….exe` (la app y el plugin de OBS)
            - **Mac con chip Apple (M1/M2/M3/M4…):** `Music-Now-Playing-…-mac-apple.zip` (la app; al abrirla instala el plugin de OBS)
            - **Mac con Intel:** `Music-Now-Playing-…-mac-intel.zip` (la app; al abrirla instala el plugin de OBS)
            - **Linux x86_64:** `Music-Now-Playing-…-linux-x64.tar.gz` (la app y el plugin de OBS: descomprime y corre `./install.sh`; necesita `playerctl`)

            ### Plugin nativo para OBS (fuente "Now Playing" y dock "Música")
            - **macOS:** `music-now-playing-plugin-…-macos.zip`
            - **Windows:** `music-now-playing-plugin-…-windows-x64.zip`
            - **Linux:** `music-now-playing-plugin-…-linux-x86_64.deb` (OBS del PPA o de la distribución) o `music-now-playing-plugin-…-linux-x86_64.tar.gz` (en `~/.config/obs-studio/plugins/`, también OBS en Flatpak)

            ${{ steps.legacy.outputs.note }}

            Cómo instalarlo: [obs-plugin/README](${{ github.server_url }}/${{ github.repository }}/tree/main/obs-plugin#instalar).

            Cómo instalar y qué hacer con los avisos de Windows/macOS/Linux: [README](${{ github.server_url }}/${{ github.repository }}/blob/main/README.es.md).
