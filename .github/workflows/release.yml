name: Release

# Publicar una versión: sube la versión en package.json, haz commit y luego
#   - empuja un tag:  git tag v2.0.1 && git push origin v2.0.1
#   - o en GitHub: Actions → Release → Run workflow (crea el tag v<versión> solo).
# Esto genera los instaladores y los adjunta a la Release de ese tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar la Release v<versión de package.json> (si no, solo deja los instaladores como artefacto)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # El instalador de Windows también instala el plugin: necesita el zip ya compilado.
  windows:
    needs: [plugin]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Herramientas (NSIS y Pillow)
        run: sudo apt-get update && sudo apt-get install -y nsis python3-pil
      - name: Versión
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "El tag es $GITHUB_REF_NAME pero package.json dice $tag"; exit 1
          fi
      - name: Prueba de humo
        run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: plugin-windows
          path: plugin-windows
      - name: Instalador de Windows (app + plugin de OBS)
        run: PLUGIN_ZIP="$(ls plugin-windows/obs-now-playing-plugin-*-windows-x64.zip)" ./build/build.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # En un Mac de verdad: la app queda firmada ad hoc entera (sin eso, macOS la da por
  # "dañada" al descargarla) y se prueba que abre.
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install pillow
      - name: Apps de macOS
        run: ./build/build.sh mac
      - name: La app firmada abre y responde
        run: |
          app_dir="$RUNNER_TEMP/prueba"
          mkdir -p "$app_dir"
          ditto -x -k dist/OBS-Now-Playing-*-mac-apple.zip "$app_dir"
          app="$app_dir/OBS Now Playing.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature"
          open "$app"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          sleep 4
          curl -fs http://127.0.0.1:8787/api/now-playing
          echo
          curl -fs http://127.0.0.1:8787/ | grep -o 'Lector del sistema:</b>.\{0,200\}' | sed 's/<[^>]*>//g'
          echo "--- log"; cat "$HOME/Library/Application Support/OBS Now Playing/log.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  # El plugin nativo de OBS (obs-plugin/), compilado en Mac y Windows.
  plugin:
    uses: ./.github/workflows/plugin.yml

  publish:
    needs: [windows, mac, plugin]
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Versión
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OBS Now Playing ${{ steps.version.outputs.tag }}
          # Solo los instaladores y los zips: los demás artefactos (capturas de las
          # pruebas del modo video) no son descargas.
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Descargas
            - **Windows 10/11:** `OBS-Now-Playing-Setup-….exe` (la app y el plugin de OBS)
            - **Mac con chip Apple (M1/M2/M3/M4…):** `OBS-Now-Playing-…-mac-apple.zip`
            - **Mac con Intel:** `OBS-Now-Playing-…-mac-intel.zip`

            ### Plugin nativo para OBS (fuente "Now Playing" y dock "Música")
            - **macOS:** `obs-now-playing-plugin-…-macos.zip`
            - **Windows:** `obs-now-playing-plugin-…-windows-x64.zip`

            Cómo instalarlo: [obs-plugin/README](${{ github.server_url }}/${{ github.repository }}/tree/main/obs-plugin#instalar).

            Cómo instalar y qué hacer con los avisos de Windows/macOS: [README](${{ github.server_url }}/${{ github.repository }}/blob/main/README.es.md).
